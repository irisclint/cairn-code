<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="cairn-logo-title">
  <title id="cairn-logo-title">Cairn</title>

  <defs>
    <!--
      Subtle radial lift so the tile does not read as flat at large sizes.
      Neutral rather than blue-black, so the tile stays a surface and the
      stones are the only thing in the mark carrying colour.
    -->
    <radialGradient id="cairn-backdrop" cx="30%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#26262e" />
      <stop offset="60%" stop-color="#17171b" />
      <stop offset="100%" stop-color="#101013" />
    </radialGradient>

    <linearGradient id="cairn-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4D87F0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4D87F0" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <g id="backdrop">
    <rect x="0" y="0" width="512" height="512" rx="61" fill="url(#cairn-backdrop)" />
    <rect x="1" y="1" width="510" height="510" rx="60" fill="none" stroke="url(#cairn-edge)" stroke-width="2" />
  </g>

  <!--
    Three stacked stones, widest at the base. The widths step down by a
    consistent ratio and the gaps stay even, which is what keeps the stack
    readable when it is scaled down to a 16px favicon: at that size the shapes
    become three bars, and uneven spacing would turn them into noise.

    Each stone is slightly asymmetric, and the top one leans, so the mark reads
    as balanced stones rather than a bar chart.
  -->
  <g id="stones">
    <!--
      One hue, stepped in tone rather than swept in a gradient. Light reads as
      coming from above, which is how a real stack looks, and a flat fill per
      stone survives being scaled to a 16px favicon where a diagonal gradient
      turns to mud.
    -->

    <!-- Base: widest, flattest, carries the stack. Darkest, as shadow falls. -->
    <rect x="112" y="316" width="288" height="88" rx="33" fill="#3A74DD" />

    <!-- Middle: offset a touch left, as a real stack settles. -->
    <rect x="146" y="214" width="220" height="84" rx="31" fill="#4D87F0" />

    <!-- Crown: smallest and tilted, the piece that says "placed by hand". -->
    <rect
      x="186"
      y="114"
      width="140"
      height="78"
      rx="29"
      fill="#FFFFFF"
      opacity="0.94"
      transform="rotate(-8 256 153)"
    />
  </g>
</svg>
