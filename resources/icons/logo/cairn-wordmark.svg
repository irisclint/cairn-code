<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96" role="img" aria-labelledby="cairn-wordmark-title">
  <title id="cairn-wordmark-title">Cairn</title>

  <defs>
    <linearGradient id="wordmark-stone" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <g id="wordmark-icon" transform="translate(0 8) scale(0.15625)">
    <rect x="0" y="0" width="512" height="512" rx="61" fill="#1A1B26" />
    <rect x="112" y="316" width="288" height="88" rx="33" fill="url(#wordmark-stone)" />
    <rect x="146" y="214" width="220" height="84" rx="31" fill="url(#wordmark-stone)" opacity="0.9" />
    <rect
      x="186"
      y="114"
      width="140"
      height="78"
      rx="29"
      fill="#FFFFFF"
      opacity="0.94"
      transform="rotate(-8 256 153)"
    />
  </g>

  <!--
    Set in the same UI font as the application, so the brand and the product
    read as one thing. The C carries the accent; the rest stays neutral.
  -->
  <text
    x="104"
    y="62"
    font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
    font-size="52"
    font-weight="600"
    letter-spacing="-1"
  >
    <tspan fill="#3B82F6">C</tspan><tspan fill="#FFFFFF">airn</tspan>
  </text>
</svg>
